<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070b;--bg2:#070d14;--panel:#0b131c;--panel2:#0f1b27;--line:#172636;--line2:#223549;--tx:#e8f1f8;--mut:#7f93a8;--gd:#00d0f0;--gd2:#5ae6ff;--ac:#ff4d6a;--ok:#2ee6a6;--warn:#ffc857;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 480px at 85% -8%,rgba(0,208,240,.10),transparent 60%),var(--bg);color:var(--tx);font:400 15.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.stat,.btn,#tabs button,.res,.brand b,.eyebrow{font-family:'Chakra Petch','Barlow Condensed',system-ui,sans-serif}
h1,h2,h3{margin:0;letter-spacing:.005em}
h2{font-size:24px;font-weight:600;margin-bottom:14px}
h3{font-weight:600}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.side{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 14px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 20px rgba(0,208,240,.28)}
.brand b{display:block;font-size:16px;line-height:1.1;font-weight:700}
.brand span{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
#tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
#tabs button{display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:1px solid transparent;color:var(--mut);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:color .2s,background .2s}
#tabs button:hover{color:var(--tx)}
#tabs button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#tabs button[aria-selected=true]{color:var(--tx);background:linear-gradient(90deg,rgba(0,208,240,.20),rgba(0,208,240,.03));border-color:rgba(0,208,240,.35);box-shadow:inset 3px 0 0 var(--gd)}
.side-foot{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.side-foot .tools{margin:0}
.content{min-width:0}
.hero{position:relative;overflow:hidden;padding:26px 20px 22px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(0,208,240,.12),transparent 55%)}
.hero-in{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gd)}
h1{font-size:clamp(30px,5vw,50px);line-height:1;font-weight:700;margin:6px 0 10px}
h1 span{color:var(--gd)}

.sub{color:var(--mut);margin:8px 0 0;max-width:62ch}
.sub a,main a{color:var(--gd2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:24px 20px 70px}
section[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .2s}
.card:hover{border-color:rgba(0,208,240,.4)}
.pl{border-top:2px solid var(--gd)}
.av{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--gd2),#0a5d70);color:#02121a;display:grid;place-items:center;font:700 22px 'Chakra Petch',sans-serif;margin-bottom:10px;box-shadow:0 0 16px rgba(0,208,240,.25)}
.pl h3{font-size:20px}.pl small{color:var(--mut);display:block}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:0 10px;margin:8px 6px 0 0;font-size:12.5px;color:var(--gd2);background:rgba(0,208,240,.06)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
.stat{font-size:38px;line-height:1.05;font-weight:700;color:var(--tx);background:linear-gradient(90deg,#fff,var(--gd2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--gd2));border-radius:999px}
.bar i.lo{background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
tr:hover td{background:rgba(0,208,240,.03)}
.w{color:var(--ok);font-weight:500}.l{color:var(--ac);font-weight:500}
.scroll{overflow-x:auto}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
label{font-size:12.5px;color:var(--mut);display:grid;gap:4px}
input,select,textarea{background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font:inherit;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gd);outline:none}
.btn{background:var(--gd);color:#02121a;border:0;border-radius:8px;padding:9px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.1);box-shadow:0 0 18px rgba(0,208,240,.35)}
.btn.alt{background:none;border:1px solid var(--line2);color:var(--tx);font-weight:600}
.btn.alt:hover{border-color:var(--gd);box-shadow:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools button{background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.tools button:hover{border-color:var(--gd)}
.tools button[aria-pressed=true]{border-color:var(--gd);color:var(--gd2);background:rgba(0,208,240,.08)}
.chipb{background:var(--bg2);color:var(--mut);border:1px solid var(--line2);border-radius:999px;padding:4px 12px;margin:2px 4px 2px 0;cursor:pointer;font:inherit;font-size:13.5px}
.chipb[aria-pressed=true]{border-color:var(--gd);color:var(--gd2);background:rgba(0,208,240,.1)}
.chipb[disabled]{opacity:.4;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:560px}
.dh{color:var(--mut);font-size:12px;text-align:center;text-transform:uppercase;letter-spacing:.08em}
.day{min-height:82px;text-align:left;vertical-align:top;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;overflow:hidden;transition:border-color .2s}
.day:hover{border-color:var(--gd)}
.chip{display:block;font-size:11px;border-radius:5px;padding:1px 5px;margin-top:3px;color:#02121a;background:var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
td input{min-width:90px}
#note{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gd);box-shadow:0 8px 30px rgba(0,0,0,.5);color:var(--tx);padding:10px 16px;border-radius:10px;z-index:9;max-width:92vw}
#auth button{padding:5px 12px;font-size:14px}
.h3{font-size:19px;margin-bottom:10px}
.li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.li:last-child{border:0}.li small{color:var(--mut);display:block}
.res{display:inline-block;min-width:58px;text-align:center;border-radius:6px;padding:1px 8px;font-size:15px;font-weight:700}
.res.w{background:rgba(46,230,166,.13);color:var(--ok);border:1px solid rgba(46,230,166,.4)}
.res.l{background:rgba(255,77,106,.13);color:var(--ac);border:1px solid rgba(255,77,106,.4)}
.bd{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:0 9px;font-size:12px;color:var(--mut)}
.bd.l{border-color:var(--ac);color:var(--ac)}.pr-alta{border-color:var(--ac);color:var(--ac)}.pr-media{border-color:var(--warn);color:var(--warn)}
.gi{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.gi:last-child{border:0}
.gi small{display:block;color:var(--mut)}.gi.done .gt{text-decoration:line-through;color:var(--mut)}
.gi select{padding:4px}.gi .btn,td .btn{padding:3px 10px;font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px}
details summary{color:var(--gd2)}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}section:not([hidden]){animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media(min-width:960px){.app{grid-template-columns:252px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);border-bottom:0;padding:22px 14px;display:flex;flex-direction:column}
#tabs{flex-direction:column;overflow:visible;margin-top:26px}#tabs button{padding:10px 12px;font-size:15px}
.side-foot{margin-top:auto;flex-direction:column;align-items:stretch;padding-top:14px;border-top:1px solid var(--line)}
.wm{height:56px}.hero{padding:34px 28px 28px}main{padding:28px 28px 70px}}
@media(max-width:959px){#auth .sub{display:none}.side-foot{margin-top:10px}}
@media(max-width:560px){.wm{height:38px}.stat{font-size:32px}}
.ro .card:has(>#fm),.ro .card:has(>#fe),.ro .card:has(>#fp),.ro .card:has(>#fg),.ro .card:has(>#fr),.ro .card:has(>#ft){display:none}
.ro #fm,.ro #fe,.ro #fp,.ro .goal-add,.ro [data-del],.ro .row form[data-p]{display:none}
.ro textarea,.ro [data-rf]{pointer-events:none}
.ro #fr,.ro [data-rdel]{display:none}
.ro td input{pointer-events:none;border-color:transparent}
.ro #fg,.ro [data-gdel],.ro [data-mdel],.ro #imp{display:none}
.ro [data-gj]{pointer-events:none;opacity:.8}
.ro [data-prm],.ro .pfl,.ro #ft,.ro [data-ted],.ro [data-tdel],.ro #tkr,.ro #tka{display:none}
.hero::before{content:"";position:absolute;inset:0;background:var(--team) center 12%/cover no-repeat;filter:grayscale(.45) contrast(1.05);opacity:.8}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#04070b 6%,rgba(4,7,11,.9) 38%,rgba(4,7,11,.45) 100%),linear-gradient(0deg,#04070b 0,transparent 45%),linear-gradient(120deg,rgba(0,208,240,.18),transparent 60%)}
.hero-in{position:relative;z-index:1}
.wm{height:50px;width:auto;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.ph{border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--gd),0 0 16px rgba(0,208,240,.25)}
.avi{display:inline-block;vertical-align:middle;margin-right:9px}.avi .av,.avi .ph{display:inline-grid;margin:0;box-shadow:0 0 0 1px var(--line2)}
.pbig{position:relative;margin:-16px -16px 12px;aspect-ratio:1;overflow:hidden;border-radius:12px 12px 0 0;background:var(--bg2)}
.pbig img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.04)}
.pbig::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,19,28,.85) 0,transparent 42%)}
.pl>.av{margin-bottom:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpis div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;color:var(--mut);font-size:12px;min-width:70px}.kpis b{display:block;font:700 22px 'Chakra Petch',sans-serif;color:var(--tx)}
.tools .pchip{display:flex;align-items:center;background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 6px;cursor:pointer;font:inherit;font-size:14px}
.tools .pchip[aria-pressed=true]{border-color:var(--gd);background:rgba(0,208,240,.1);color:var(--gd2)}
.ro #fev,.ro [data-evdel],.ro .pecol,.ro [data-pesave]{display:none}
</style>
</head>

var STAFF=[{k:"acewing",n:"Acewing",r:"Head Coach"},{k:"olmos",n:"Olmos",r:"Assistant Coach"}];
function pkey(n){var s=String(n||"").normalize("NFKC").toLowerCase();
if(/^v.*yx/.test(s)||s.indexOf("visyx")>=0)return"vsyx";if(s.indexOf("zen")===0)return"zen";if(s.indexOf("snooky")>=0)return"snooky";if(s.indexOf("ando")>=0)return"ando";if(s.indexOf("veil")>=0)return"veil";if(s.indexOf("emt")===0)return"emt";if(s.indexOf("espinacho")>=0)return"espinacho";return""}
function pic(p){return p.ph||PH[pkey(p.n)]||""}
function av(p,sz){var k=pic(p);return k?'<img class="ph" src="'+k+'" alt="'+esc(p.n)+'" width="'+sz+'" height="'+sz+'" style="width:'+sz+'px;height:'+sz+'px">':'<div class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.4)+'px">'+esc(String(p.n).charAt(0).toUpperCase())+'</div>'}
function bigPh(p){var k=pic(p);return k?'<div class="pbig"><img src="'+k+'" alt="'+esc(p.n)+'"></div>':'<div class="av">'+esc(String(p.n).charAt(0).toUpperCase())+'</div>'}
function staffHtml(){return '<h2 style="margin-top:26px">Staff técnico</h2><div class="grid">'+STAFF.map(function(m){return '<div class="card pl"><div class="pbig"><img src="'+PH[m.k]+'" alt="'+esc(m.n)+'"></div><h3>'+esc(m.n)+'</h3><small>'+esc(m.r)+'</small></div>'}).join("")+'</div>'}
function rPanel(){var s=stats(),td=iso(TD);
var recent=M.slice().sort(function(a,b){return a.d<b.d?1:-1}).slice(0,5);
var ups=E.filter(function(e){return e.d>=td}).sort(cmp);
var past=E.filter(function(e){return e.t==="Entrenamiento"&&e.d<td}),tm=0,cn=0;
past.forEach(function(e){P.forEach(function(p,i){cn++;if((A[e.id]||{})[i]===1)tm++})});
var att=cn?Math.round(tm/cn*100)+"%":"-",dn=G.filter(function(g){return gst(g)==="completado"}).length;
var al=[];
if(!E.some(function(e){return e.t==="Premier"&&e.d>=td}))al.push("No hay partido de Premier agendado.");
ups.slice(0,3).forEach(function(e){var a=A[e.id]||{},pe=P.filter(function(p,i){return a[i]==null}).length;if(pe)al.push(pe+" jugador"+(pe>1?"es":"")+" sin confirmar para "+e.t+" del "+fmt(e.d)+".")});
var nn=M.filter(function(x){return !(x.w||x.f||x.c)}).length;if(nn)al.push(nn+" partida"+(nn>1?"s":"")+" sin notas postpartido.");
var od=G.filter(function(g){return gst(g)!=="completado"&&g.fl&&g.fl<td}).length;if(od)al.push(od+" objetivo"+(od>1?"s":"")+" vencido"+(od>1?"s":"")+".");
if(past.length>=2)P.forEach(function(p,i){var y=past.filter(function(e){return (A[e.id]||{})[i]===1}).length;if(y/past.length<0.6)al.push(p.n+" tiene menos de 60% de asistencia.")});
var nk=P.filter(function(p){return +p.kd>0}),nc=P.filter(function(p){return +p.acs>0}),
